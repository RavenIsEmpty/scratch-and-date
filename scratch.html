<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Our Weekend Plan 💌</title>
<link rel="icon" href="heart-logo.png" type="image/x-icon" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #ff3d6e;
    --text: #4a2c3a;
    --muted: #8a6b78;
    --soft: #fff0f5;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",sans-serif; -webkit-tap-highlight-color:transparent; }
  html, body { touch-action:manipulation; -webkit-text-size-adjust:100%; }
  body {
    min-height:100vh; min-height:100dvh; color:var(--text); padding:20px 16px 40px;
    background:linear-gradient(-45deg,#ff6f91,#ff9a9e,#fecfef,#ffb6c1); background-size:400% 400%;
    animation:bg 14s ease infinite; overflow-x:hidden;
  }
  @keyframes bg { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

  .bg-hearts { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bg-heart { position:absolute; bottom:-40px; color:rgba(255,255,255,.5); animation:rise linear infinite; }
  @keyframes rise { 0%{transform:translateY(0);opacity:0} 10%{opacity:1} 100%{transform:translateY(-110vh) rotate(25deg);opacity:0} }

  .card {
    position:relative; z-index:1; max-width:560px; margin:0 auto; padding:30px 20px 26px;
    border-radius:28px; text-align:center;
    background:rgba(255,255,255,.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.6); box-shadow:0 20px 50px rgba(200,40,90,.25);
    animation:popIn .6s cubic-bezier(.22,1,.36,1);
  }
  @keyframes popIn { from{transform:translateY(20px) scale(.96);opacity:0} to{transform:none;opacity:1} }

  .eyebrow { font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  h1 { font-family:"Pacifico",cursive; font-weight:400; color:var(--accent); font-size:34px; line-height:1.25; margin-bottom:6px; }
  .subtitle { color:var(--muted); font-size:14px; margin-bottom:18px; }

  /* Category chips */
  .chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
  .chip {
    border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    background:var(--soft); color:var(--text); transition:all .2s;
  }
  .chip.active { background:var(--accent); color:#fff; box-shadow:0 6px 14px rgba(255,61,110,.35); }

  /* Ticket grid */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  @media (max-width:520px) { .grid { grid-template-columns:repeat(2,1fr); } }

  .ticket {
    position:relative; aspect-ratio:1/1.1; border-radius:18px; overflow:hidden;
    box-shadow:0 6px 16px rgba(200,40,90,.18); animation:deal .45s cubic-bezier(.22,1,.36,1) backwards;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  @keyframes deal { from{transform:translateY(20px) rotate(-4deg);opacity:0} to{transform:none;opacity:1} }

  .prize {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; padding:12px 10px; background:linear-gradient(160deg,#fff,#ffe3ee);
  }
  .prize .emoji { font-size:36px; line-height:1.1; }
  .prize .title { font-size:14px; font-weight:700; line-height:1.25; }
  .prize .desc { font-size:11.5px; color:var(--muted); line-height:1.35; }
  .pick-btn {
    margin-top:6px; border:none; padding:6px 14px; border-radius:999px; font-size:12px; font-weight:600;
    color:#fff; background:var(--accent); cursor:pointer; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .ticket.revealed .pick-btn { opacity:1; pointer-events:auto; }
  .ticket.revealed { box-shadow:0 0 0 3px rgba(255,61,110,.35), 0 8px 20px rgba(200,40,90,.25); }

  .ticket canvas {
    position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; transition:opacity .5s;
  }
  .ticket.revealed canvas { opacity:0; pointer-events:none; }

  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn {
    border:none; padding:13px 22px; border-radius:999px; font-size:15px; font-weight:600; cursor:pointer;
    transition:transform .15s ease, box-shadow .2s;
  }
  .btn:active { transform:scale(.96); }
  .btn-main { color:#fff; background:linear-gradient(135deg,var(--accent),#ff7a9c); box-shadow:0 8px 20px rgba(255,61,110,.4); }
  .btn-soft { color:var(--accent); background:var(--soft); }
  .tip { margin-top:14px; font-size:12px; color:var(--muted); }

  /* Result modal */
  .modal {
    position:fixed; inset:0; z-index:40; display:none; place-items:center; padding:20px;
    background:rgba(74,44,58,.45);
  }
  .modal.show { display:grid; }
  .result {
    width:100%; max-width:360px; background:#fff; border-radius:26px; padding:28px 22px 24px; text-align:center;
    box-shadow:0 24px 50px rgba(0,0,0,.25); animation:unfold .5s cubic-bezier(.22,1,.36,1);
  }
  @keyframes unfold { from{transform:scale(.7);opacity:0} to{transform:none;opacity:1} }
  .result img {
    width:120px; height:120px; border-radius:50%; object-fit:cover; border:5px solid #ffe3ee; margin-bottom:10px;
  }
  .result .big-emoji { font-size:54px; margin-bottom:4px; }
  .result h2 { font-family:"Pacifico",cursive; font-weight:400; color:var(--accent); font-size:30px; margin-bottom:8px; }
  .result .plan { font-size:18px; font-weight:700; margin-bottom:4px; }
  .result .when { font-size:14px; color:var(--muted); margin-bottom:20px; }
  .result .actions { flex-direction:column; }

  .confetti { position:fixed; top:-30px; pointer-events:none; z-index:60; animation:fall 3.2s linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); opacity:.2; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
  <div class="bg-hearts" aria-hidden="true"></div>

  <main class="card">
    <p class="eyebrow">Weekend plans</p>
    <h1>Pick a card 💌</h1>
    <p class="subtitle">Scratch any card to see what we could do this weekend. Pick the one you like!</p>

    <div class="chips" id="chips">
      <button class="chip active" data-cat="all">✨ All</button>
      <button class="chip" data-cat="food">🍜 Food</button>
      <button class="chip" data-cat="outdoor">🌳 Outdoor</button>
      <button class="chip" data-cat="trip">✈️ Trip</button>
      <button class="chip" data-cat="movie">🎬 Movie</button>
      <button class="chip" data-cat="chill">🛋️ Chill</button>
      <button class="chip" data-cat="fun">🎉 Fun</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="actions">
      <button class="btn btn-main" id="shuffle">🔀 New cards</button>
      <button class="btn btn-soft" id="surprise">🎲 Surprise me</button>
    </div>
    <p class="tip">Don't like any of them? Tap "New cards" for a fresh set.</p>
  </main>

  <div class="modal" id="modal">
    <div class="result">
      <img src="asset/In_Love.jpg" alt="Happy cat in love" onerror="this.style.display='none'" />
      <div class="big-emoji" id="rEmoji"></div>
      <h2>It's a date!</h2>
      <p class="plan" id="rTitle"></p>
      <p class="when" id="rWhen"></p>
      <div class="actions">
        <button class="btn btn-main" id="closeModal">Can't wait 💞</button>
        <button class="btn btn-soft" id="again">Pick something else</button>
      </div>
    </div>
  </div>

<script>

    // 🎬 Movie
    { cat:"movie", e:"🍿", t:"Cinema date", d:"Big screen, big popcorn, sit in the back" },

    { cat:"movie", e:"📺", t:"K-drama binge", d:"Start a new series together" },

    { cat:"movie", e:"🦸", t:"Superhero night", d:"Action, snacks, loud speakers" },
    { cat:"movie", e:"😭", t:"Sad movie challenge", d:"First one to cry buys dessert" },
    { cat:"movie", e:"🛋️", t:"Blanket fort movie", d:"Build a fort, then watch inside it" },

    // 🛋️ Chill
    { cat:"chill", e:"🎧", t:"Playlist swap", d:"Make a playlist for each other" },
    { cat:"chill", e:"📚", t:"Bookstore date", d:"Pick a book for each other" },
    { cat:"chill", e:"🧩", t:"Puzzle night", d:"500 pieces, snacks, no rush" },
    { cat:"chill", e:"💆", t:"Self-care day", d:"Face masks and lazy vibes" },
    { cat:"chill", e:"☕", t:"Coffee & deep talk", d:"Ask each other deep questions" },
    { cat:"chill", e:"🌙", t:"Late night call", d:"Talk until one of us falls asleep" },
    { cat:"chill", e:"💅", t:"Spa or massage", d:"Relax together for an hour" },
    { cat:"chill", e:"✍️", t:"Write letters", d:"Write to each other, read them out loud" },
    { cat:"chill", e:"🪴", t:"Plant shopping", d:"Buy a little plant to take care of" },
    { cat:"chill", e:"⭐", t:"Rooftop stargazing", d:"Late night, clear sky, no phones" },

    // 🎉 Fun
    { cat:"fun", e:"🎳", t:"Bowling", d:"Loser buys drinks 😏" },
    { cat:"fun", e:"🎤", t:"Karaoke", d:"Duet is mandatory" },
    { cat:"fun", e:"🕹️", t:"Arcade battle", d:"Claw machine until we win something" },
    { cat:"fun", e:"🎨", t:"Paint each other", d:"Bad portraits only" },
    { cat:"fun", e:"🎮", t:"Game night", d:"Co-op game or 1v1, your choice" },
    { cat:"fun", e:"🏸", t:"Badminton match", d:"Best of 3, no crying" },
    { cat:"fun", e:"📷", t:"Photo booth", d:"Silly faces, keep one strip each" },
    { cat:"fun", e:"🎁", t:"Tiny gift challenge", d:"Buy each other a gift under a small budget" },
    { cat:"fun", e:"🧁", t:"Bake together", d:"Probably messy, definitely fun" },
    { cat:"fun", e:"🎯", t:"Try something new", d:"Something neither of us has ever done" },
    { cat:"fun", e:"💃", t:"Dance class", d:"Learn one dance, laugh a lot" },
    { cat:"fun", e:"🏺", t:"Pottery class", d:"Make matching cups (or ugly ones)" },
    { cat:"fun", e:"🛍️", t:"Mall day", d:"Window shopping, snacks and games" },
    { cat:"fun", e:"🔐", t:"Escape room", d:"Teamwork test, can we get out?" },
    { cat:"fun", e:"🏊", t:"Pool day", d:"Swim, sun and cold drinks" },
    { cat:"fun", e:"🎲", t:"Board game café", d:"Play until someone gets competitive" },
  ];
  const CARDS_PER_ROUND = 6;
  const WHEN = ["This Saturday 💞", "This Sunday 💞", "This weekend 💞"];
  /* ====================================== */

  const grid = document.getElementById("grid");
  const modal = document.getElementById("modal");
  let category = "all";
  let current = [];

  // Ambient hearts
  const bg = document.querySelector(".bg-hearts");
  for (let i = 0; i < 16; i++) {
    const h = document.createElement("span");
    h.className = "bg-heart";
    h.textContent = ["❤","♥","💗","💕"][i % 4];
    h.style.left = Math.random() * 100 + "%";
    h.style.fontSize = 12 + Math.random() * 20 + "px";
    h.style.animationDuration = 8 + Math.random() * 10 + "s";
    h.style.animationDelay = -Math.random() * 18 + "s";
    bg.appendChild(h);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pool() {
    return category === "all" ? ACTIVITIES : ACTIVITIES.filter(a => a.cat === category);
  }

  function deal() {
    // Avoid repeating the cards from the last round when possible
    const prev = new Set(current.map(a => a.t));
    let fresh = shuffle(pool().filter(a => !prev.has(a.t)));
    if (fresh.length < CARDS_PER_ROUND) fresh = fresh.concat(shuffle(pool().filter(a => prev.has(a.t))));
    current = fresh.slice(0, CARDS_PER_ROUND);

    grid.innerHTML = "";
    current.forEach((a, i) => {
      const t = document.createElement("div");
      t.className = "ticket";
      t.style.animationDelay = i * 0.06 + "s";
      t.innerHTML = `
        <div class="prize">
          <div class="emoji">${a.e}</div>
          <div class="title">${a.t}</div>
          <div class="desc">${a.d}</div>
          <button class="pick-btn">Pick this 💖</button>
        </div>
        <canvas></canvas>`;
      grid.appendChild(t);
      t.querySelector(".pick-btn").onclick = () => choose(a);
      requestAnimationFrame(() => setupScratch(t, i + 1));
    });
  }

  function setupScratch(ticket, number) {
    const cv = ticket.querySelector("canvas");
    const ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const w = ticket.clientWidth, h = ticket.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.scale(dpr, dpr);

    // Silver cover
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#c9c9d3"); g.addColorStop(.5, "#f1f1f6"); g.addColorStop(1, "#b3b3c0");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // Sparkle dots
    ctx.fillStyle = "rgba(255,255,255,.7)";
    for (let i = 0; i < 40; i++) ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    ctx.fillStyle = "#ff6f91"; ctx.textAlign = "center";
    ctx.font = "28px Poppins"; ctx.fillText("💝", w / 2, h / 2 - 8);
    ctx.fillStyle = "#7d7d8c"; ctx.font = "600 13px Poppins";
    ctx.fillText("Card " + number, w / 2, h / 2 + 20);
    ctx.font = "500 11px Poppins"; ctx.fillText("scratch me", w / 2, h / 2 + 38);

    let drawing = false, last = null, revealed = false;
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    function scratchTo(p) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 34;
      ctx.beginPath();
      ctx.moveTo((last || p).x, (last || p).y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
    }
    function check() {
      const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let clear = 0, total = 0;
      for (let i = 3; i < d.length; i += 4 * 16) { total++; if (d[i] === 0) clear++; }
      if (clear / total > 0.45) reveal();
    }
    function reveal() {
      if (revealed) return;
      revealed = true;
      ticket.classList.add("revealed");
      sparkle(ticket);
    }
    const stop = () => { if (!drawing) return; drawing = false; last = null; check(); };
    cv.addEventListener("pointerdown", e => { drawing = true; last = null; cv.setPointerCapture(e.pointerId); scratchTo(pos(e)); });
    cv.addEventListener("pointermove", e => {
      // Also scratch when a pressed mouse/finger slides in from the edge
      if (!drawing && e.buttons) { drawing = true; last = null; }
      if (drawing) scratchTo(pos(e));
    });
    cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") stop(); });
    cv.addEventListener("pointerup", stop);
    cv.addEventListener("pointercancel", stop);
    ticket.reveal = reveal;
  }

  function sparkle(el) {
    const r = el.getBoundingClientRect();
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.textContent = ["✨","💖","💕"][i % 3];
      s.style.left = r.left + Math.random() * r.width + "px";
      s.style.top = r.top + "px";
      s.style.fontSize = "16px";
      s.style.animationDuration = "1.6s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1800);
    }
  }

  function confetti() {
    const icons = ["💖","💕","✨","💗","🌸","🥰"];
    for (let i = 0; i < 60; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.textContent = icons[i % icons.length];
      s.style.left = Math.random() * 100 + "vw";
      s.style.fontSize = 14 + Math.random() * 20 + "px";
      s.style.animationDelay = Math.random() * .9 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 4500);
    }
  }

  function choose(a) {
    document.getElementById("rEmoji").textContent = a.e;
    document.getElementById("rTitle").textContent = a.t;
    document.getElementById("rWhen").textContent = WHEN[Math.floor(Math.random() * WHEN.length)];
    modal.classList.add("show");
    confetti();
  }

  // Controls
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    category = c.dataset.cat;
    current = [];
    deal();
  });
  document.getElementById("shuffle").onclick = deal;
  document.getElementById("surprise").onclick = () => {
    // Reveal a random unrevealed card for her
    const hidden = [...grid.querySelectorAll(".ticket:not(.revealed)")];
    if (!hidden.length) { deal(); return; }
    const t = hidden[Math.floor(Math.random() * hidden.length)];
    t.scrollIntoView({ behavior: "smooth", block: "center" });
    t.reveal();
  };
  document.getElementById("closeModal").onclick = () => modal.classList.remove("show");
  document.getElementById("again").onclick = () => { modal.classList.remove("show"); deal(); };
  modal.onclick = e => { if (e.target === modal) modal.classList.remove("show"); };

  // Block pinch/double-tap zoom on iOS too
  document.addEventListener("gesturestart", e => e.preventDefault());
  let lastTap = 0;
  document.addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTap < 300 && !e.target.closest("canvas")) e.preventDefault();
    lastTap = now;
  }, { passive: false });

  // Wait for fonts so the card covers draw with Poppins
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(deal);
</script>
</body>
</html>
